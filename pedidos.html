<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Migaja | Pedidos</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilos propios (Corregida extensión de style3.js a style3.css) -->
    <link rel="stylesheet" href="style3.css">
</head>

<body>
    <!-- ==================== NAVEGACIÓN ==================== -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center" href="index.html">
                    <img src="https://static.vecteezy.com/system/resources/previews/017/625/331/non_2x/bread-icon-simple-style-bread-company-big-sale-poster-background-symbol-bread-brand-logo-design-element-bread-t-shirt-printing-bread-for-sticker-vector.jpg" alt="Logo de La Migaja" class="logo me-2">
                    <strong>La Migaja</strong>
                </a>

                <button class="navbar-toggler" type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#menuPrincipal"
                        aria-controls="menuPrincipal"
                        aria-expanded="false"
                        aria-label="Abrir menú">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="catalogo.html">Catálogo</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="pedidos.html">Pedidos</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-5">
        <h1 class="fw-bold mb-4">Resumen de tu Pedido</h1>

        <div class="row g-4">
            <!-- Tabla de Pedidos -->
            <div class="col-lg-8">
                <div class="card shadow-sm p-3">
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead>
                                <tr>
                                    <th>Producto</th>
                                    <th>Precio</th>
                                    <th>Cantidad</th>
                                    <th>Subtotal</th>
                                    <th>Acción</th>
                                </tr>
                            </thead>
                            <tbody id="tablaPedido">
                                <!-- Se llena dinámicamente desde script3.js -->
                            </tbody>
                        </table>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <h4>Total: $<span id="totalPedido">0.00</span></h4>
                        <button class="btn btn-outline-danger btn-sm" onclick="vaciarCarrito()">Vaciar Carrito</button>
                    </div>
                </div>
            </div>

            <!-- Formulario de Confirmación -->
            <div class="col-lg-4">
                <div class="card shadow-sm p-4">
                    <h3 class="h5 fw-bold mb-3">Datos del Cliente</h3>
                    <form id="formPedido" onsubmit="confirmarPedido(event)">
                        <div class="mb-3">
                            <label for="nombreCliente" class="form-label">Nombre completo</label>
                            <input type="text" class="form-control" id="nombreCliente" required>
                        </div>
                        <div class="mb-3">
                            <label for="telefonoCliente" class="form-label">Teléfono</label>
                            <input type="tel" class="form-control" id="telefonoCliente" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Confirmar Pedido</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer py-4 mt-auto">
        <div class="container text-center">
            <p class="mb-0">La Migaja © Derechos reservados</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script3.js"></script>
</body>
</html>
